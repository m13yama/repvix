[package]
name = "repvix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A predictable multi-repository workspace manager"
license = "MIT"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.23.0"
