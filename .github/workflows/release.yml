name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Test
        run: cargo +stable test --locked --target "$TARGET"
      - name: Build release binary
        run: cargo +stable build --release --locked --target "$TARGET"
      - name: Package release
        run: |
          mkdir -p dist
          asset="repvix-$TARGET.tar.gz"
          tar -czf "dist/$asset" -C "target/$TARGET/release" repvix -C "$GITHUB_WORKSPACE" LICENSE README.md CONTRIBUTING.md docs assets
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          cp install.sh dist/install.sh
          echo "REPVIX_TEST_ARCHIVE=$GITHUB_WORKSPACE/dist/$asset" >> "$GITHUB_ENV"
      - name: Test installer and packaged binary
        run: |
          bash -n install.sh
          python3 -m unittest discover -s tests -p 'test_install.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: repvix-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: repvix-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cp install.sh dist/install.sh
          # Upload everything before publishing, including when retrying a draft.
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release.json; then
            if ! jq -e '.isDraft' release.json > /dev/null; then
              echo "Release $GITHUB_REF_NAME is already published; use a new version." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
